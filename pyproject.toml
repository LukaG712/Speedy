[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedy-cli"
version = "1.0.0"
description = "CLI for the Evershade ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "LukaG712"}]
dependencies = [
    "click==8.1.7",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "rich==13.7.0",
]

[project.urls]
Homepage = "https://github.com/LukaG712/Speedy"
Repository = "https://github.com/LukaG712/Speedy"

[project.optional-dependencies]
dev = ["pytest==8.3.0", "ruff==0.9.0"]

[project.scripts]
evershade = "speedy.cli:main"

[tool.setuptools.packages.find]
include = ["speedy*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
timeout = 60
